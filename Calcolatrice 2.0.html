<html>
    <head>
        <title>Calcolatrice 2.0</title>
        <style>
            /* Reset e Stile Globale */
            * {
                box-sizing: border-box;
                font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                transition: all 0.25s ease;
            }

            body {
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                color: #f8fafc;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }

            /* Titolo */
            h1 {
                font-size: 2.5rem;
                font-weight: 800;
                letter-spacing: -0.5px;
                background: linear-gradient(90deg, #38bdf8, #818cf8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 25px;
            }

            /* Campi di Input */
            input[type="text"] {
                width: 320px;
                padding: 16px 20px;
                margin-bottom: 14px;
                border: 2px solid #334155;
                border-radius: 16px;
                background-color: #1e293b;
                color: #f8fafc;
                font-size: 1.3rem;
                font-weight: 600;
                text-align: right;
                outline: none;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            }

            input[type="text"]:focus {
                border-color: #38bdf8;
                background-color: #0f172a;
                box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
            }

            /* Pulsanti Operatori */
            button {
                width: 58px;
                height: 58px;
                border: none;
                border-radius: 16px;
                background: #334155;
                color: #38bdf8;
                font-size: 1.5rem;
                font-weight: 700;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin: 8px 4px 20px 4px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            }

            button:hover {
                background: #38bdf8;
                color: #0f172a;
                transform: translateY(-2px);
                box-shadow: 0 8px 15px rgba(56, 189, 248, 0.4);
            }

            button:active {
                transform: translateY(1px);
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            }

            /* Area Risultato */
            p#risultato {
                width: 320px;
                min-height: 65px;
                margin-top: 10px;
                padding: 16px;
                background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
                border-radius: 16px;
                box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
                color: #ffffff;
                font-size: 1.8rem;
                font-weight: 800;
                text-align: right;
                word-wrap: break-word;
            }
        </style>
    </head>
    <body>
        <script>
        function getInputs() {
            const val1 = document.getElementById("num1").value.trim();
            const val2 = document.getElementById("num2").value.trim();
            
            if (val1 === "" || val2 === "") {
                return null;
            }
            
            const n1 = parseFloat(val1);
            const n2 = parseFloat(val2);
            
            if (isNaN(n1) || isNaN(n2)) {
                return null;
            }
            
            return { n1, n2 };
        }

        function calcola(operazione) {
            const inputs = getInputs();
            const resEl = document.getElementById("risultato");

            if (!inputs) {
                resEl.innerText = "Errore";
                return;
            }

            const { n1, n2 } = inputs;
            let risultato = 0;

            switch(operazione) {
                case '+':
                    risultato = n1 + n2;
                    break;
                case '-':
                    risultato = n1 - n2;
                    break;
                case '*':
                    risultato = n1 * n2;
                    break;
                case '/':
                    if (n2 === 0) {
                        risultato = 1;
                    } else {
                        risultato = n1 / n2;
                    }
                    break;
            }

            resEl.innerText = risultato;
        }
        </script>
        <h1>Calcolatrice</h1>
        <input type="text" id="num1" placeholder="Primo numero"><br>
        <input type="text" id="num2" placeholder="Secondo numero"><br>
        <button onclick="calcola('+')">+</button>
        <button onclick="calcola('-')">-</button>
        <button onclick="calcola('*')">*</button>
        <button onclick="calcola('/')">/</button>
        <p id="risultato"></p>
    </body>
</html>
