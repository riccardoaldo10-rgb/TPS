<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella Anagrafica 1.0</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        /* Form Card */
        form {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fcfcfc;
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background-color: #ffffff;
        }

        button {
            grid-column: span 2;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Table Section */
        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-main);
            padding: 16px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.95rem;
            background-color: #ffffff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">&larr; Torna alla Home (Index)</a>
        
        <h2>Gestione Anagrafica</h2>

        <!-- Form di inserimento -->
        <form id="anagraficaForm">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="es. Mario" required>
            </div>
            <div class="form-group">
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" placeholder="es. Rossi" required>
            </div>
            <div class="form-group full-width">
                <label for="indirizzo">Indirizzo</label>
                <input type="text" id="indirizzo" placeholder="es. Via Roma 10" required>
            </div>
            <div class="form-group">
                <label for="citta">Città</label>
                <input type="text" id="citta" placeholder="es. Milano" required>
            </div>
            <div class="form-group">
                <label for="eta">Età</label>
                <input type="number" id="eta" placeholder="es. 25" required>
            </div>
            <button type="submit">Aggiungi alla Tabella</button>
        </form>

        <h2>Elenco Registrati</h2>
        <div class="table-container">
            <table id="tabellaAnagrafica">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Indirizzo</th>
                        <th>Città</th>
                        <th>Età</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Nessuna riga fissa qui dentro, partiamo puliti -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const form = document.getElementById('anagraficaForm');
        const tabella = document.getElementById('tabellaAnagrafica').getElementsByTagName('tbody')[0];

        form.addEventListener('submit', function(event) {
            // Evita il ricaricamento della pagina
            event.preventDefault();

            // Leggiamo e puliamo i valori da eventuali spazi vuoti
            const nome = document.getElementById('nome').value.trim();
            const cognome = document.getElementById('cognome').value.trim();
            const indirizzo = document.getElementById('indirizzo').value.trim();
            const citta = document.getElementById('citta').value.trim();
            const eta = document.getElementById('eta').value.trim();

            // Sicurezza: se manca anche un solo valore, blocchiamo tutto per evitare righe vuote
            if (!nome || !cognome || !indirizzo || !citta || !eta) {
                return;
            }

            // Inseriamo la nuova riga nella tabella
            const nuovaRiga = tabella.insertRow();
            
            // Creiamo le celle e assegnamo direttamente il testo
            nuovaRiga.insertCell(0).textContent = nome;
            nuovaRiga.insertCell(1).textContent = cognome;
            nuovaRiga.insertCell(2).textContent = indirizzo;
            nuovaRiga.insertCell(3).textContent = citta;
            nuovaRiga.insertCell(4).textContent = eta;

            // Puliamo i campi del form per il prossimo inserimento
            form.reset();
        });
    </script>

</body>
</html>
