<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella Anagrafica 1.0</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        /* Container al posto del form */
        .form-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            background-color: #fcfcfc;
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            background-color: #ffffff;
        }

        button {
            grid-column: span 2;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Table Section */
        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-main);
            padding: 16px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.95rem;
            background-color: #ffffff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">&larr; Torna alla Home (Index)</a>
        
        <h2>Gestione Anagrafica</h2>

        <!-- Area di inserimento (senza form) -->
        <div class="form-container">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" class="tdati" placeholder="es. Mario">
            </div>
            <div class="form-group">
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" class="tdati" placeholder="es. Rossi">
            </div>
            <div class="form-group full-width">
                <label for="indirizzo">Indirizzo</label>
                <input type="text" id="indirizzo" class="tdati" placeholder="es. Via Roma 10">
            </div>
            <div class="form-group">
                <label for="citta">Città</label>
                <input type="text" id="citta" class="tdati" placeholder="es. Milano">
            </div>
            <div class="form-group">
                <label for="eta">Età</label>
                <input type="number" id="eta" class="tdati" placeholder="es. 25">
            </div>
            <!-- Pulsante con type="button" e chiamata diretta alla funzione onclick -->
            <button type="button" onclick="aggiungiRiga()">Aggiungi alla Tabella</button>
        </div>

        <h2>Elenco Registrati</h2>
        <div class="table-container">
            <table id="tabellaAnagrafica">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Indirizzo</th>
                        <th>Città</th>
                        <th>Età</th>
                    </tr>
                </thead>
                <!-- Tbody con id "dati" per l'aggancio delle righe -->
                <tbody id="dati">
                    <!-- Nessuna riga fissa, partiamo puliti -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function aggiungiRiga() {
            // Raccogliamo tutti gli input con classe 'tdati'
            const inputDati = document.querySelectorAll('.tdati');

            // Verifichiamo se almeno un campo è vuoto
            for (let input of inputDati) {
                if (input.value.trim() === "") {
                    alert("Compila tutti i campi prima di aggiungere la riga.");
                    return;
                }
            }

            // Creiamo dinamicamente le celle della riga usando i valori presi in sequenza da .tdati
            const nuovaRiga = document.createElement('tr');
            nuovaRiga.innerHTML = `
                <td>${inputDati[0].value}</td>
                <td>${inputDati[1].value}</td>
                <td>${inputDii = inputDati[2].value.trim()}</td>
                <td>${inputDati[3].value}</td>
                <td>${inputDati[4].value}</td>
            `;
            
            // Correzione per pulizia codice riga indirizzo:
            nuovaRiga.innerHTML = `
                <td>${inputDati[0].value}</td>
                <td>${inputDati[1].value}</td>
                <td>${inputDati[2].value}</td>
                <td>${inputDati[3].value}</td>
                <td>${inputDati[4].value}</td>
            `;

            // Agganciamo la riga direttamente all'elemento con id "dati" (il tbody)
            document.getElementById('dati').appendChild(nuovaRiga);

            // Puliamo i campi di input dopo l'aggiunta
            inputDati.forEach(input => input.value = '');
        }
    </script>

</body>
</html>
